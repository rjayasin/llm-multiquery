<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        padding: 12px;
        font: 13px/1.4 system-ui, sans-serif;
        width: 320px;
        box-sizing: border-box;
      }
      label {
        display: block;
        margin-bottom: 6px;
        color: #444;
      }
      input {
        width: 100%;
        padding: 8px;
        font-size: 14px;
        box-sizing: border-box;
        border: 1px solid #bbb;
        border-radius: 6px;
      }
      .hint {
        margin-top: 6px;
        color: #888;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <label for="q">Ask Claude, ChatGPT &amp; Gemini:</label>
    <input id="q" type="text" autofocus placeholder="Type your prompt and press Enter" />
    <div class="hint">Opens all three in new tabs.</div>
    <script src="popup.js"></script>
  </body>
</html>
